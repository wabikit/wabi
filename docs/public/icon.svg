<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Wabi">
  <!-- Wabi gem: a faceted gem with a chipped top-right edge — the wabi-sabi
       "beautifully imperfect" mark that names the library. Monochrome solid.
       Adapts to the browser's light/dark chrome via prefers-color-scheme. -->
  <style>
    .body { fill: #18181b; }
    @media (prefers-color-scheme: dark) { .body { fill: #fafafa; } }
  </style>
  <!-- base silhouette (chip on the upper-right edge) -->
  <path class="body" d="M9 6.5 L22.5 6 L26 10 L24.5 11.2 L28 13 L16 28 L4 13 Z"/>
  <!-- table (top, brightest) -->
  <path d="M9 6.5 L22.5 6 L21.5 13 L10.5 13 Z" fill="#fff" fill-opacity="0.13"/>
  <!-- right crown (with chip) + right pavilion (highlight side) -->
  <path d="M22.5 6 L26 10 L24.5 11.2 L28 13 L21.5 13 Z" fill="#fff" fill-opacity="0.20"/>
  <path d="M21.5 13 L28 13 L16 28 Z" fill="#fff" fill-opacity="0.10"/>
  <!-- left crown + left pavilion (shadow side) -->
  <path d="M9 6.5 L10.5 13 L4 13 Z" fill="#000" fill-opacity="0.18"/>
  <path d="M4 13 L10.5 13 L16 28 Z" fill="#000" fill-opacity="0.12"/>
</svg>
