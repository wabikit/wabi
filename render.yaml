# Render Blueprint for the Wabi docs site (which also serves the component
# registry at /r/*.json).
#
# Monorepo notes:
#   - The Rails app lives in docs/ (rootDir below). It serves /r/<name>.json by
#     reading ../registry/dist/r at runtime. That dist/ is gitignored and
#     regenerated by registry/bin/build, so the BUILD must run it.
#   - The registry has its OWN Gemfile; we bundle it separately and override
#     BUNDLE_GEMFILE so it doesn't inherit the docs app's bundle.
#
# First-deploy checklist (see the message accompanying this file):
#   - Set RAILS_MASTER_KEY in the Render dashboard (sync:false → you paste it).
#   - If Render's native Ruby buildpack lacks Ruby 4.0.5, switch this service to
#     `runtime: docker` using docs/Dockerfile (with the build context widened to
#     the repo root so registry/ is available). Noted as a fallback.
services:
  - type: web
    name: wabi-docs
    runtime: ruby
    rootDir: docs
    plan: free            # $0; sleeps after ~15min idle. Bump to "starter" ($7) for always-on.
    buildCommand: |
      bundle install
      ( cd ../registry && BUNDLE_GEMFILE="$PWD/Gemfile" bundle install && BUNDLE_GEMFILE="$PWD/Gemfile" bundle exec ./bin/build )
      bin/rails tailwindcss:build
      bin/rails assets:precompile
      # Rebuild the Pagefind search index from the current components every deploy,
      # so search is always up to date without anyone remembering to regenerate +
      # commit it. Best-effort: if it fails (e.g. npx/pagefind unavailable), fall
      # back to the committed docs/public/pagefind/ so the deploy still ships.
      bin/rails wabi:docs:index || echo "WARN: pagefind reindex failed — serving the committed index"
    startCommand: bin/rails server -p $PORT -b 0.0.0.0
    autoDeploy: true
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false                 # paste your docs/config/master.key value in the dashboard
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"               # propshaft serves precompiled assets (no nginx in front)
      - key: RAILS_LOG_TO_STDOUT
        value: "true"               # logs show up in Render
