name: gem-ci

on:
  push:
    branches: [main]
    paths:
      - "gem/**"
      - ".github/workflows/gem-ci.yml"
  pull_request:
    paths:
      - "gem/**"
      - ".github/workflows/gem-ci.yml"

jobs:
  rspec:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Cover the oldest supported Ruby (gemspec: >= 3.4) and the current one.
        ruby: ["3.4", "4.0.5"]
    defaults:
      run:
        working-directory: gem
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: gem
      - run: bundle exec rspec
