name: js-test

on:
  push:
    branches: [main]
    paths:
      - "registry/**"
      - ".github/workflows/js-test.yml"
  pull_request:
    paths:
      - "registry/**"
      - ".github/workflows/js-test.yml"

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: registry
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: registry/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: registry/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # test:coverage (not bare test) so the coverage thresholds in
      # vitest.config.js gate CI — the run fails if coverage drops below the floor.
      - run: pnpm run test:coverage
