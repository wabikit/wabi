name: registry-build

on:
  push:
    branches: [main]
    paths:
      - "registry/**"
      - "gem/**"
      - ".github/workflows/registry-build.yml"
  pull_request:
    paths:
      - "registry/**"
      - "gem/**"
      - ".github/workflows/registry-build.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: registry
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.5"
          bundler-cache: true
          working-directory: registry
      - run: bundle exec rspec
      - run: bundle exec ./bin/build
      - name: Verify every component compiled to dist
        run: |
          test -f dist/r/index.json
          missing=0
          for dir in components/*/; do
            name=$(basename "$dir")
            case "$name" in _*) continue ;; esac   # skip _shared and other private dirs
            if [ ! -f "dist/r/${name}.json" ]; then
              echo "Missing dist for component: ${name}"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || (echo "Some components have source but no compiled dist/r/<name>.json" && exit 1)
