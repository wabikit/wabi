name: registry-build

on:
  push:
    branches: [main]
    paths:
      - "registry/**"
      - "gem/**"
      - ".github/workflows/registry-build.yml"
  pull_request:
    paths:
      - "registry/**"
      - "gem/**"
      - ".github/workflows/registry-build.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: registry
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.5"
          bundler-cache: true
          working-directory: registry
      - run: bundle exec rspec
      - run: bundle exec ./bin/build
      - name: Verify dist artifacts exist for all Sprint 0-2 components
        run: |
          test -f dist/r/index.json
          for name in button input textarea label card badge separator alert avatar checkbox switch select; do
            test -f dist/r/${name}.json || (echo "Missing: ${name}.json" && exit 1)
          done
